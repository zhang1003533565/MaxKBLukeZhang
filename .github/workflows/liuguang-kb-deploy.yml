name: Build and Deploy 流光知识库

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/liuguang-kb

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          IMAGE_NAME_LOWER="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="${IMAGE_NAME_LOWER}:${GITHUB_SHA::12}"
          echo "image_name=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ steps.image.outputs.image_name }}:latest
          build-args: |
            DOCKER_IMAGE_TAG=${{ github.ref_name }}
            BUILD_AT=${{ github.run_id }}
            GITHUB_COMMIT=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_SERVER_DEPLOY == 'true' }}
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH || '/opt/liuguang-kb' }}"
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard "${{ github.sha }}"
            if [ ! -f deploy/.env ]; then
              cp deploy/.env.example deploy/.env
            fi
            if grep -q '^LIUGUANG_KB_IMAGE=' deploy/.env; then
              sed -i.bak 's|^LIUGUANG_KB_IMAGE=.*|LIUGUANG_KB_IMAGE=${{ needs.build.outputs.image_ref }}|' deploy/.env
            else
              printf '\nLIUGUANG_KB_IMAGE=%s\n' '${{ needs.build.outputs.image_ref }}' >> deploy/.env
            fi
            DEPLOY_MODE=pull ./scripts/server-deploy.sh
