services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: maxkb-dev-postgres
    environment:
      POSTGRES_DB: maxkb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Password123@postgres
    ports:
      - "5432:5432"
    volumes:
      - maxkb-dev-postgres:/var/lib/postgresql/data
      - ./docker/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d maxkb"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: maxkb-dev-redis
    command: redis-server --requirepass Password123@redis
    ports:
      - "6379:6379"
    volumes:
      - maxkb-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Password123@redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  maxkb-dev-postgres:
  maxkb-dev-redis:
